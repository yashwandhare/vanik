name: API checks

on:
  push:
    branches: [main, "feat/main-*", "fix/main-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vanik
          POSTGRES_USER: vanik
          POSTGRES_PASSWORD: vanik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vanik -d vanik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RUN_POSTGRES_INTEGRATION: "1"
      AGENT_KEY_ENCRYPTION_SECRET: >-
        synthetic-ci-agent-encryption-secret-for-tests
      DEMO_ACCOUNT_PASSWORD: synthetic-ci-account-password-for-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.12"
      - name: Install uv
        run: python -m pip install uv==0.9.30
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make migrate
      - run: make seed
      - run: uv --directory apps/api run --locked alembic check
      - run: make test
      - name: Verify migration downgrade and re-upgrade
        run: |
          uv --directory apps/api run --locked alembic downgrade base
          make migrate
